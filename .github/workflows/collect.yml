name: collect

on:
  schedule:
    # 毎日 18:07（JST）。休日さがし dot（20:52）より前に新着をそろえる
    - cron: "7 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect
        run: python collect.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data feed.xml
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "collect: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
          fi
